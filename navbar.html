<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- link css -->
    <link rel="stylesheet" href="/styles/navbar.css" />

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="navbar">
      <nav class="navbar">
        <!--company logo -->
        <div class="company-logo">
          <p>GYM <span>FIT</span></p>
        </div>
        <!-- menu -->
        <ul id="nav-menu-list">
          <li>
            <a href="index.html" id="home-nav-menu">Home</a>
          </li>

          <li>
            <a href="womens.html" id="Womens-nav-menu">Womens</a>
          </li>

          <li>
            <a href="mens.html" id="MENS-nav-menu">MENS</a>
          </li>
        </ul>

        <!-- rightSide button  -->
        <ul id="nav-btn-list">
          <li id="search-icon">
            <img src="/assets/nav-icons/search.png" alt="" />
          </li>
          <li id="love-icon">
            <img src="/assets/nav-icons/love.png" alt="" />
          </li>
          <li id="user-icon">
            <img src="/assets/nav-icons/user.png" alt="" />
          </li>
          <li class="cart">
            <img src="/assets/nav-icons/cart.png" alt="" /> <span>0</span>
          </li>
        </ul>
      </nav>
      <!-- end of desktop menu -->

      <!-- left mobile area -->
      <div class="mobile-nav">
        <div class="mobile-nav-side">
          <div class="hamburger" id="hamburger">☰</div>

          <div id="search-icon-mobile">
            <img src="/assets/nav-icons/search.png" alt="" />
          </div>
        </div>
        <!-- mobile logo -->
        <span class="mobile-text">GT</span>

        <ul id="mobile-nav-btn-list">
          <li id="love-icon">
            <img src="/assets/nav-icons/love.png" alt="" />
          </li>

          <li class="cart">
            <img src="/assets/nav-icons/cart.png" alt="" /> <span>1</span>
          </li>
        </ul>
      </div>

      <div class="mobile-menu-container">
        <div class="close-icon">
          <i class="fa-solid fa-xmark"></i>
        </div>

        <ul>
          <li>
            <a href="/index.html">Home</a>
          </li>

          <li>
            <a href="/womens.html">Womens</a>
          </li>

          <li>
            <a href="/mens.html">MENS</a>
          </li>
        </ul>
      </div>

      <div class="sub-nav">
        <div class="underline"></div>
        <div class="sub-nav-info">
          <p>Free Returns now for 30 days*</p>
          <p class="sign-up">Sign up to emails you</p>
        </div>
        <div class="underline"></div>
      </div>

    <script src="/js/menu.js"></script>
    <script src="/js/mobile-nav.js"></script>

</html>
